# docs/examples/ci-gradle.yml
# Drop this file into your Gradle plugin/library repo at
# .github/workflows/ci.yml
# It triggers a build-and-test run on every push and pull request,
# without publishing any artifacts.
#
# NOTE: The @main ref below tracks the latest reusable workflow. For
# reproducible builds and supply-chain safety, pin to a full-length commit
# SHA of this repository once your team has stabilised on a version, e.g.:
#   uses: Dans-Plugins/dpc-mvn-repo/.github/workflows/reusable-build-gradle.yml@<full-commit-sha>
# This repository has no release tags yet, so a ref such as @v1 does not
# resolve.

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    uses: Dans-Plugins/dpc-mvn-repo/.github/workflows/reusable-build-gradle.yml@main
    with:
      java-version: '17'
