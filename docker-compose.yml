services:
  nexus:
    image: sonatype/nexus3:3.85.0@sha256:a2f0af994a4022a127414e9733adcf175ffb655d266fb4b0836717c5aa33a58d
    container_name: dpc-maven-repo
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=273m

volumes:
  nexus-data:
    driver: local
