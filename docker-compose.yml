# Values in ${VAR:-default} form are read from a .env file in this directory
# (see .env.example). Every default is the value that was previously hardcoded,
# so the service is unchanged when no .env exists.
services:
  nexus:
    image: sonatype/nexus3:3.85.0@sha256:a2f0af994a4022a127414e9733adcf175ffb655d266fb4b0836717c5aa33a58d
    container_name: dpc-maven-repo
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8081}:8081"
    volumes:
      - nexus-data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms${NEXUS_MIN_HEAP:-512m} -Xmx${NEXUS_MAX_HEAP:-512m} -XX:MaxDirectMemorySize=${NEXUS_MAX_DIRECT_MEMORY:-273m}

volumes:
  nexus-data:
    driver: local
