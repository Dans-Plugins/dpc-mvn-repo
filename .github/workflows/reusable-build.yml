# .github/workflows/reusable-build.yml
# Reusable workflow — build & test only, no artifact deployment.
# Called by individual DPC plugin repos for CI on push/PR.

name: Reusable — Build & Test

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to build with'
        required: false
        type: string
        default: '17'
      maven-args:
        description: 'Extra Maven arguments passed to mvn verify'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    # A reusable workflow inherits the caller's token permissions. Building and
    # testing needs nothing beyond reading the checked-out source, so cap it
    # explicitly rather than inheriting each adopting repository's default.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      # maven-args is bound to an env var rather than expanded into the script
      # body, so an input containing shell metacharacters is passed as arguments
      # rather than executed.
      - name: Build & Test
        env:
          MAVEN_ARGS: ${{ inputs.maven-args }}
        run: mvn --batch-mode clean verify ${MAVEN_ARGS}
