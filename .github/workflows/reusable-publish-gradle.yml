# .github/workflows/reusable-publish-gradle.yml
# Reusable workflow — called by individual DPC plugin/library repos that use
# Gradle to build and publish JAR artifacts to the self-hosted DPC Nexus
# Maven repository.
#
# Releases  → pushed when the triggering ref is a tag matching v*
# Snapshots → pushed for all other refs (branches, manual dispatch, etc.)
#
# Each Gradle project must declare a maven-publish repository that reads
# NEXUS_URL, NEXUS_REPO_TYPE, NEXUS_USERNAME, and NEXUS_PASSWORD from the
# environment. See docs/examples/publish-gradle.yml and PUBLISHING.md for
# the required build.gradle / build.gradle.kts snippet.

name: Reusable — Build & Publish to DPC Maven Repo (Gradle)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to build with'
        required: false
        type: string
        default: '17'
      gradle-args:
        description: 'Extra Gradle arguments passed to ./gradlew publish'
        required: false
        type: string
        default: ''
    secrets:
      NEXUS_USERNAME:
        description: 'Nexus deploy username'
        required: true
      NEXUS_PASSWORD:
        description: 'Nexus deploy password or token'
        required: true
      NEXUS_URL:
        description: 'Base URL of the Nexus instance (e.g. https://repo.dansplugins.com)'
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # A reusable workflow inherits the caller's token permissions. Publishing
    # needs nothing beyond reading the checked-out source, so cap it explicitly
    # rather than inheriting whatever each adopting repository defaults to.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: gradle

      # Values are bound to env vars rather than expanded into the script body:
      # a ${{ }} expansion is substituted before the shell parses the line, so a
      # ref or input containing shell metacharacters would otherwise be executed
      # rather than compared. This job holds the Nexus credentials, which makes
      # it the worst place in the repository for that pattern.
      - name: Determine target repository
        id: repo
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "type=releases" >> "$GITHUB_OUTPUT"
          else
            echo "type=snapshots" >> "$GITHUB_OUTPUT"
          fi

      # Repositories that committed gradlew without the executable mode bit
      # otherwise fail the next step with "Permission denied".
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # Nexus rejects a -SNAPSHOT version in maven-releases and a release
      # version in maven-snapshots, but only once the full build has run, and
      # its error does not name the cause. Compare the two before building.
      - name: Verify version matches target repository
        env:
          REPO_TYPE: ${{ steps.repo.outputs.type }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: |
          # :properties, not properties — the unqualified name runs in every
          # subproject of a multi-project build and prints one version each.
          VERSION="$(./gradlew --quiet :properties ${GRADLE_ARGS} | sed -n 's/^version: //p')"
          if [ -z "$VERSION" ] || [ "$VERSION" = unspecified ]; then
            echo "::error::Could not resolve the project version; set version in build.gradle / build.gradle.kts."
            exit 1
          fi
          if [[ "$REPO_TYPE" == releases && "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Version $VERSION is a SNAPSHOT, but a v* tag routes it to maven-releases, which rejects SNAPSHOTs. Set version in build.gradle / build.gradle.kts to the release version (e.g. ${VERSION%-SNAPSHOT}) and re-tag."
            exit 1
          fi
          if [[ "$REPO_TYPE" == snapshots && "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Version $VERSION is not a SNAPSHOT, but this ref is not a v* tag, so it routes to maven-snapshots, which rejects release versions. Publish releases by pushing a v* tag, or set version in build.gradle / build.gradle.kts to $VERSION-SNAPSHOT."
            exit 1
          fi
          echo "Version $VERSION matches maven-$REPO_TYPE."

      - name: Build & Publish
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_REPO_TYPE: ${{ steps.repo.outputs.type }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: ./gradlew publish ${GRADLE_ARGS}
